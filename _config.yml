# Site
title: "KaZe's Corner"
description: "Rambling about things"
author:
  name: "Luiz Santos"
url: "https://luiz-santos.com"
baseurl: ""
repository: "luizgamedev/luizgamedev.github.io"
logo: "/assets/images/site_logo.png"
locale: "en_US"
timezone: Europe/Dublin
encoding: "utf-8"

# No Twitter account. This also stops the theme from adding its author's handle.
twitter: false

social:
  name: "Luiz Santos"
  links:
    - "https://www.linkedin.com/in/luizgosantos/"

# Theme
theme: moonwalk

theme_config:
  appearance: "dark" # "dark" or "light"
  appearance_toggle: false # true shows a light/dark switch to visitors
  date_format: "%Y-%m-%d"
  show_description: true
  show_navbar: true
  show_footer: true
  show_copyright: true
  show_projects: false
  show_old_projects: false
  show_misc_list: false
  show_blog: true
  show_reading_time: true
  show_tags: true
  show_code_copy: true
  show_progress_bar: true
  show_back_to_top: true
  show_post_nav: true
  show_toc: true
  show_footnote_tooltips: true
  show_link_previews: false
  home:
    title_blog: Blog

# Pixel-art header shown at the top of the home page and other pages.
pixel_header:
  tagline: "Luiz Santos · games, photos and notes from Dublin"

# Moonwalk turns on Soopr share buttons and a credit by default. Leave this off.
soopr: false

# Content. These permalinks match the old site, so existing links keep working.
permalink: /:categories/:title/
excerpt_separator: "\n\n"
include:
  - _pages
exclude:
  - README.md
  - CLAUDE.md
  - assets/photos/README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .github
  - .sass-cache
  - .jekyll-cache
  - tools

collections:
  photograph:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: photograph
    values:
      layout: album

# Markdown
markdown: kramdown
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-soopr-seo-tag

# Moonwalk loads these two plugins by itself. They publish llms.txt and Markdown
# copies of every post for AI tools, so keep them switched off.
llms_output:
  enabled: false
markdown_output:
  enabled: false
