---
layout: default
---

{% include pixel_header.html compact=true %}
<h1 class="page-title">{{ page.title }}</h1>

{% if page.avatar %}
  <img class="avatar" src="{{ page.avatar | relative_url }}" alt="{{ site.author.name }}" width="160" height="160">
{% endif %}

<div class="post-content">
  {{ content }}
</div>

{% if site.theme_config.show_footer == true %}
  {% include site_footer.html %}
{% endif %}
